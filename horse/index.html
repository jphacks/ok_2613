<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>カオス競馬 DX</title><style>
:root{font-family:system-ui,'Hiragino Kaku Gothic ProN',sans-serif;color:#fff;background:#10243d}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#37a9ef 0 34%,#328d51 34% 47%,#936843 47%);min-height:100vh}.app{max-width:1250px;margin:auto;padding:15px}.top{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap}.panel{background:#071a32eF;border:2px solid #77caff;border-radius:18px;padding:14px;box-shadow:0 5px 0 #09203c}h1{font-size:clamp(25px,4vw,42px);margin:0;color:#ffdc50;text-shadow:3px 3px #d43e2e}.sub{font-size:12px;margin:0}.settings{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.settings label{font-size:14px}.settings select,.settings input,button{border-radius:10px;padding:10px;border:2px solid #a8dfff;font-weight:bold}button{cursor:pointer;background:#ffcf45;color:#18233d;border-color:#fff;box-shadow:0 3px 0 #b07c12}button:disabled{opacity:.5;cursor:not-allowed}.coins{font-size:23px;color:#ffdf58;font-weight:900}.layout{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:12px;margin-top:15px}.stadium{overflow:hidden;border:3px solid #fff;border-radius:20px;background:linear-gradient(#77d4ff 0 22%,#36895d 22% 32%,#ad7950 32%);position:relative}.stands{height:94px;position:relative;background:linear-gradient(0deg,#24545d 0 25%,#59a86d 25% 50%,#7ed0ff 50%)}.stands:after{content:'🏟️  🎉  👏  🎺  👏  🎉  🏟️';position:absolute;bottom:6px;left:2%;letter-spacing:15px;white-space:nowrap}.track{position:relative;padding:10px 0;background:repeating-linear-gradient(0deg,#ae7c53 0 76px,#9c6c45 76px 80px)}.lane{height:80px;position:relative;border-bottom:3px dashed #e5cbaa}.lane:last-child{border:0}.lane-label{position:absolute;left:7px;top:6px;z-index:4;border-radius:30px;padding:5px 9px;background:#09233ddc;font-size:12px;max-width:125px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.runner{position:absolute;top:22px;left:0;display:flex;align-items:center;justify-content:center;width:58px;height:49px;z-index:3;will-change:left;transition:left .07s linear}.horse{font-size:43px;display:inline-block;transform:scaleX(-1);filter:drop-shadow(2px 3px 1px #51331d)}.runner.fall .horse{transform:scaleX(-1) rotate(-70deg)}.runner.sleep .horse{transform:scaleX(-1) rotate(15deg);opacity:.55}.runner.boost .horse{filter:drop-shadow(0 0 10px #ffea00)}.runner.done .horse{filter:drop-shadow(0 0 9px #fff)}.bubble{position:absolute;top:-15px;font-size:15px;white-space:nowrap;font-weight:900;text-shadow:1px 2px #111}.finish-line{position:absolute;top:0;bottom:0;width:9px;left:88%;z-index:2;background:repeating-linear-gradient(to bottom,#fff 0 12px,#121b2a 12px 24px);box-shadow:0 0 9px #fff}.finish-title{position:absolute;left:calc(88% - 27px);top:-7px;z-index:5;color:#fff000;font-weight:900;text-shadow:2px 2px #141414}.sidebar h2{margin:0 0 10px}.rank{display:flex;align-items:center;gap:9px;border-radius:12px;background:#254361;padding:10px;margin:7px 0}.rank strong{color:#ffde62}.commentary{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.log{height:175px;overflow:auto;font-size:13px;line-height:1.65}.log div{border-bottom:1px solid #ffffff26;padding:2px}.status{font-weight:bold;color:#ffe16b;min-height:25px}.personality{margin-top:12px;background:#173d59;border:1px solid #7dd8ff;border-radius:12px;padding:12px;font-size:14px}.personality strong{color:#ffde62}.choice{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.choice label{background:#2a4c69;padding:7px;border-radius:10px;font-size:13px;cursor:pointer}.choice label:has(input:checked){outline:3px solid #ffe35c}.flash{animation:flash .3s 3}@keyframes flash{50%{filter:brightness(1.8)}}@media(max-width:800px){.layout{grid-template-columns:1fr}.commentary{grid-template-columns:1fr}.lane-label{font-size:10px;max-width:90px}.horse{font-size:35px}.runner{width:46px}}
</style></head><body><main class="app"><div class="top"><div class="panel"><h1>👑 カオス競馬 DX</h1><p class="sub">何が起こるかわからない！</p></div><div class="panel settings"><label>レース距離 <select id="distance"><option value="800">800m</option><option value="1600">1600m</option><option value="2000" selected>2000m</option><option value="3200">3200m</option></select></label><label><input id="sound" type="checkbox" checked> 効果音</label><label><input id="voice" type="checkbox"> 音声実況</label></div><div class="panel"><div>所持コイン</div><div class="coins" id="balance">10,000 C</div><button id="reset">コイン初期化</button></div></div><div class="panel" style="margin-top:12px"><div class="settings"><strong>予想する馬</strong><div id="choices" class="choice"></div><label>賭けるコイン <input type="number" id="bet" min="1" value="100" style="width:105px"></label><button id="start">🏁 レース開始！</button></div><p class="sub">ゲーム内だけの架空コインです。オッズはゲーム用の設定値です。</p><div id="personality" class="personality" aria-live="polite"></div></div><div class="layout"><section class="stadium"><div class="stands"></div><div class="track" id="track"><div class="finish-line"></div><div class="finish-title">GOAL</div></div></section><aside class="panel sidebar"><h2>🏆 最終順位</h2><div id="ranks">全頭ゴールで順位が確定！</div><p class="status" id="status">馬を選んでスタート！</p></aside></div><div class="commentary"><section class="panel"><h2>🎙️ 実況</h2><div id="log" class="log" aria-live="polite"></div></section><section class="panel"><h2>🎲 カオスイベント</h2><p>💤 居眠り　🍌 転倒　🚀 覚醒　😵 やる気ゼロ　💨 大爆走<br>🐎 性格によって発生率が変化！</p><p>白黒のゴールラインを馬の先頭が超えた順に着順が決まります。全頭がゴールするまで続行！</p><button id="again">新しいレースを準備</button></section></div></main><script>
'use strict';
const horses=[{name:'サンダー',odds:2.0,power:1.13,personality:'⚡ 短気なスピード狂',detail:'序盤から速い！ ただし転びやすい。',fall:2.0,sleep:.35,boost:.8,stamina:.83},{name:'ミラクル',odds:3.0,power:1.06,personality:'😴 超マイペース',detail:'よく寝るけど、起きたら意外と速い。',fall:.65,sleep:2.5,boost:1.0,stamina:1.05},{name:'ロケット',odds:4.0,power:1.02,personality:'🚀 後半型の天才',detail:'前半は控えめ。残り半分から一気に加速！',fall:.85,sleep:.7,boost:1.2,stamina:1.32},{name:'スター',odds:6.0,power:.97,personality:'🍀 強運の持ち主',detail:'事故を回避しやすく、安定して走る。',fall:.35,sleep:.5,boost:.9,stamina:1.1},{name:'レジェンド',odds:10.0,power:.92,personality:'👑 気分屋の大穴',detail:'普段は遅いが、突然覚醒して爆走することも。',fall:1.1,sleep:1.2,boost:2.6,stamina:1.0}];
const $=id=>document.getElementById(id);const key='otonania_coins_v1';let balance=10000;try{const saved=localStorage.getItem(key);if(saved!==null&&Number.isSafeInteger(Number(saved))&&Number(saved)>=0)balance=Number(saved)}catch(e){}
function showPersonality(){const h=horses[selected];$('personality').innerHTML='<strong>'+h.name+' — '+h.personality+'</strong><div>'+h.detail+'</div>'}let running=false,interval=null,positions=[],finishOrder=[],selected=0,startedAt=0,previousLeader=-1,audioCtx=null,epoch=0;
function save(){try{localStorage.setItem(key,String(balance))}catch(e){}$('balance').textContent=balance.toLocaleString()+' C'}
function beep(freq=650,duration=.12){if(!$('sound').checked)return;try{audioCtx??=new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='triangle';o.frequency.value=freq;g.gain.setValueAtTime(.075,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+duration)}catch(e){}}
function say(t){if(!$('voice').checked||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=1.18;speechSynthesis.speak(u)}catch(e){}}
function log(t,speak=false){const line=document.createElement('div');line.textContent='['+new Date().toLocaleTimeString('ja-JP',{hour12:false})+'] '+t;$('log').prepend(line);if(speak)say(t)}
function init(){const choices=$('choices');choices.innerHTML='';horses.forEach((h,i)=>{const label=document.createElement('label');const radio=document.createElement('input');radio.type='radio';radio.name='pick';radio.value=i;radio.checked=i===selected;radio.disabled=running;radio.addEventListener('change',()=>{selected=i;showPersonality()});label.append(radio,document.createTextNode(' '+h.name+' '+h.odds.toFixed(1)+'倍'));choices.append(label)});const track=$('track');track.querySelectorAll('.lane').forEach(x=>x.remove());horses.forEach((h,i)=>{const lane=document.createElement('div');lane.className='lane';const tag=document.createElement('span');tag.className='lane-label';tag.textContent=(i+1)+' '+h.name;const runner=document.createElement('div');runner.className='runner';runner.id='runner'+i;const horse=document.createElement('span');horse.className='horse';horse.textContent='🏇';const bubble=document.createElement('span');bubble.className='bubble';bubble.id='bubble'+i;runner.append(horse,bubble);lane.append(tag,runner);track.append(lane)});positions=horses.map(()=>({p:0,stun:0,boost:0,finished:false}));finishOrder=[];$('ranks').textContent='全頭ゴールで順位が確定！';$('status').textContent='馬を選んでスタート！';showPersonality();save()}
function finishX(){return $('track').clientWidth*.88}
function draw(i){const r=$('runner'+i),p=positions[i],max=finishX()-r.offsetWidth; r.style.left=Math.max(0,Math.min(max,p.p*max))+'px'}
function eventFor(i){
 const p=positions[i],h=horses[i];if(p.finished||p.stun>0)return;
 const runner=$('runner'+i),b=$('bubble'+i),name=h.name;
 // 馬ごとの性格で、転倒・居眠り・やる気低下・覚醒の発生確率を変える
 const weights=[.23*h.fall,.21*h.sleep,.23,.33*h.boost];
 let pick=Math.random()*weights.reduce((a,v)=>a+v,0),type=0;
 while(type<weights.length-1&&pick>=weights[type]){pick-=weights[type];type++}
 runner.classList.remove('fall','sleep','boost');
 if(type===0){
   if(i===3&&Math.random()<.55){b.textContent='🍀 神回避！';log(name+'、バナナを華麗に回避！',true);beep(850,.15)}
   else{p.stun=18;runner.classList.add('fall');b.textContent='🍌 ずっこけ！';log(name+'、バナナで転倒！',true);beep(220,.3)}
 }else if(type===1){p.stun=24;runner.classList.add('sleep');b.textContent='💤 おやすみ';log(name+'、レース中に昼寝！',true);beep(260,.2)}
 else if(type===2){p.stun=14;b.textContent='😵 やる気ゼロ';log(name+'、突然やる気を失った！',true)}
 else{p.boost=i===4?52:32;runner.classList.add('boost');b.textContent=i===4?'👑 伝説覚醒！':'🚀 覚醒！';log(name+'、突然の覚醒モード！',true);beep(950,.25)}
 const myEpoch=epoch;
 setTimeout(()=>{if(myEpoch!==epoch)return;b.textContent='';runner.classList.remove('fall','sleep','boost')},2200)
}
function endRace(){running=false;clearInterval(interval);$('start').disabled=false;$('distance').disabled=false;document.querySelectorAll('input[name=pick]').forEach(e=>e.disabled=false);const winner=finishOrder[0],bet=Number($('bet').dataset.currentBet),prize=winner===selected?Math.floor(bet*horses[selected].odds):0;balance+=prize;save();const result=prize?'🎉 的中！ +'+prize.toLocaleString()+' C':'😢 はずれ！ -'+bet.toLocaleString()+' C';$('status').textContent=result;log('最終順位：'+finishOrder.map((i,n)=>(n+1)+'着 '+horses[i].name).join(' / '),true);log(result);beep(prize?1100:340,.35)}
function tick(){const elapsed=performance.now()-startedAt;const distance=Number($('distance').value);const ticks=distance/800*110;for(let i=0;i<horses.length;i++){const p=positions[i];if(p.finished)continue;if(p.stun>0){p.stun--;continue}const h=horses[i];const staminaFactor=1+(h.stamina-1)*p.p;const rocketFactor=i===2&&p.p>.5?1.38:1;const thunderFactor=i===0&&p.p<.35?1.13:1;const speed=(.6+Math.random()*.9)*h.power*staminaFactor*rocketFactor*thunderFactor*(p.boost>0?(i===4?2.65:2.1):1);p.p+=speed/ticks;if(p.boost>0)p.boost--;if(p.p>=1){p.p=1;p.finished=true;finishOrder.push(i);const place=finishOrder.length;const el=document.createElement('div');el.className='rank';el.innerHTML='<strong>'+place+'着</strong><span>'+horses[i].name+'</span>';if(place===1)$('ranks').replaceChildren(el);else $('ranks').append(el);$('runner'+i).classList.add('done');log(place+'着 '+horses[i].name+'が白線を通過！',place===1);beep(place===1?1100:650,.18)}draw(i)}if(finishOrder.length===horses.length){endRace();return}if(Math.random()<.095){const eligible=positions.map((p,i)=>!p.finished?i:-1).filter(i=>i>=0);if(eligible.length)eventFor(eligible[Math.floor(Math.random()*eligible.length)])}const lead=positions.reduce((best,p,i)=>!p.finished&&p.p>(positions[best]?.p??-1)?i:best,0);if(lead!==previousLeader&&finishOrder.length===0){previousLeader=lead;if(Math.random()<.4)log(horses[lead].name+'が先頭に立った！')}if(elapsed>180000){positions.forEach((p,i)=>{if(!p.finished){p.p=1;p.finished=true;finishOrder.push(i);draw(i);const el=document.createElement('div');el.className='rank';el.textContent=finishOrder.length+'着 '+horses[i].name;$('ranks').append(el)}});endRace()}}
function start(){if(running)return;const bet=Number($('bet').value);if(!Number.isSafeInteger(bet)||bet<1||bet>balance){alert('所持コイン以内で、1以上の整数を入力してください');return}balance-=bet;save();$('bet').dataset.currentBet=bet;init();running=true;$('start').disabled=true;$('distance').disabled=true;document.querySelectorAll('input[name=pick]').forEach(e=>e.disabled=true);$('status').textContent='スタート準備中…';const myEpoch=++epoch;let n=3;log('出走準備！ '+$('distance').value+'mレース。個性豊かな5頭が集結！');beep(550);const countdown=setInterval(()=>{if(myEpoch!==epoch){clearInterval(countdown);return}if(n>0){$('status').textContent='スタートまで '+n+'！';beep(500+n*100);n--}else{clearInterval(countdown);$('status').textContent='🔥 レース開始！';log('スタート！ 全5頭が飛び出した！',true);beep(1000,.3);startedAt=performance.now();previousLeader=-1;interval=setInterval(tick,75)}},650)}
$('start').addEventListener('click',start);$('again').addEventListener('click',()=>{if(running){alert('レースが終わるまでお待ちください');return}init();log('新しいレースを準備しました')});$('reset').addEventListener('click',()=>{if(running)return;if(confirm('所持コインを10,000 Cに戻しますか？')){balance=10000;save()}});init();log('カオス競馬DXへようこそ！');
</script></body></html>
